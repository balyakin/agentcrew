[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcrew"
version = "1.0.0"
description = "Local, verifiable coding teams in tmux"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "Evgeny Balyakin"}]
readme = "README.md"
dependencies = ["textual==8.2.8"]

[project.urls]
Homepage = "https://github.com/balyakin/agentcrew"
Documentation = "https://github.com/balyakin/agentcrew#readme"
Issues = "https://github.com/balyakin/agentcrew/issues"
Changelog = "https://github.com/balyakin/agentcrew/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
agentcrew = "agentcrew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentcrew = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["real_provider: opt-in tests requiring a paid authenticated provider", "integration: real Git, SQLite and tmux tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
